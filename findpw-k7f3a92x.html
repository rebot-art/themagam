  }
  .card{
    width:100%;max-width:420px;background:rgba(255,253,246,.97);
    border:1.5px solid #B3372B;border-radius:14px;padding:26px 24px 22px;
    box-shadow:0 4px 18px rgba(90,70,40,.12);
  }
  .eyebrow{text-align:center;font-size:11px;color:#B3372B;letter-spacing:2px;font-weight:600;}
  h1{font-family:"Noto Serif KR","Nanum Myeongjo",serif;text-align:center;
     font-size:23px;letter-spacing:2px;margin:6px 0 2px;}
  .sub{text-align:center;font-size:11px;color:#B3372B;letter-spacing:3px;margin:0 0 18px;}
  .lede{font-size:12.5px;color:#6B5F52;line-height:1.65;margin:0 0 18px;}
  .lede b{color:#2B2620;}
  input{
    width:100%;background:transparent;border:none;border-bottom:1px solid rgba(150,120,80,.5);
    padding:9px 4px;font:inherit;font-size:15px;color:#2B2620;margin-bottom:12px;
  }
  input:focus{outline:none;border-bottom-color:#B3372B;}
  button{
    width:100%;background:#4A140D;color:#FFFDF6;border:none;border-radius:8px;
    padding:12px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;margin-top:4px;
  }
  button:hover{background:#5C1A11;}
  button:disabled{opacity:.55;cursor:default;}
  .msg{font-size:12.5px;margin:12px 0 0;min-height:1.4em;line-height:1.6;}
  .msg.bad{color:#B3372B;font-weight:700;}
  .out{
    margin-top:16px;padding:16px;border:1.5px dashed #B3372B;border-radius:10px;
    background:rgba(179,55,43,.05);text-align:center;display:none;
  }
  .out.on{display:block;}
  .out .lbl{font-size:11.5px;color:#6B5F52;}
  .out .pw{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:26px;font-weight:700;letter-spacing:3px;color:#B3372B;margin:7px 0;
    user-select:all;
  }
  .out .go{display:inline-block;margin-top:8px;font-size:12.5px;color:#4A140D;font-weight:600;}
  .foot{font-size:11px;color:#8A7B68;line-height:1.7;margin-top:18px;}

<body>
<div class="card">
  <div class="eyebrow">— WRITERS' ROOM —</div>
  <h1>임시 비밀번호 찾기</h1>
  <div class="sub">T H E M A G A M</div>

  <p class="lede">
    방이 새 집으로 옮겨지면서 <b>비밀번호만</b> 임시로 바뀌었어요.
    닉네임과 <b>지금까지 쓰던 비밀번호</b>를 넣으면 새 임시 비밀번호를 알려드려요.<br>
    (기록·카드·꾸밈은 전부 그대로예요!)
  </p>

  <input type="text" id="nick" placeholder="닉네임" autocomplete="off" spellcheck="false">
  <input type="password" id="pw" placeholder="지금까지 쓰던 비밀번호" autocomplete="off">
  <button id="btn">찾기</button>
  <p class="msg" id="msg"></p>

  <div class="out" id="out">
    <div class="lbl">🔑 새 임시 비밀번호</div>
    <div class="pw" id="pwout"></div>
    <div class="lbl">새 방에 들어가서 <b>설정 › 🔒 개인정보</b> 에서<br>꼭 내 것으로 바꿔 주세요.</div>
    <a class="go" href="./" >→ 새 방으로 가기</a>
  </div>

  <p class="foot">
    ⚠️ 본인 확인을 위해 <b>옛 비밀번호</b>를 물어봐요. 닉네임만으로는 알려주지 않습니다.<br>
    이 페이지는 모두가 비밀번호를 바꾸면 없앨 거예요.
  </p>
</div>

function nickToEmail(nick){
  let hex = "";
  for (const b of new TextEncoder().encode(nick)) hex += b.toString(16).padStart(2, "0");
  return "n" + hex + "@themagam.local";
}
const el = (id) => document.getElementById(id);
function say(t, bad){ const m = el("msg"); m.textContent = t || ""; m.className = "msg" + (bad ? " bad" : ""); }

async function 찾기(){
  const nick = (el("nick").value || "").trim();
  const pw   = el("pw").value || "";
  el("out").classList.remove("on");
  if (!nick) return say("닉네임을 적어 주세요.", true);
  if (!pw)   return say("지금까지 쓰던 비밀번호를 적어 주세요.", true);

  el("btn").disabled = true;
  say("확인 중…");
  try {
    await firebase.auth().signInWithEmailAndPassword(nickToEmail(nick), pw);
    try { await firebase.auth().signOut(); } catch(e){}     /* 확인만 하고 바로 끊습니다 */
    const found = TBL[nick];
    if (!found) return say("명단에 없는 닉네임이에요. 방장에게 말씀해 주세요.", true);
    el("pwout").textContent = found;
    el("out").classList.add("on");
    say("");
  } catch (e) {
    const c = e && e.code;
    if (c === "auth/too-many-requests") say("시도가 너무 많았어요. 잠시 뒤에 다시 해주세요.", true);
    else if (c === "auth/network-request-failed") say("인터넷 연결을 확인해 주세요.", true);
    else say("닉네임이나 비밀번호가 달라요.", true);
  } finally {
    el("btn").disabled = false;
  }
}
el("btn").addEventListener("click", 찾기);
["nick","pw"].forEach(id => el(id).addEventListener("keydown", e => {
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === "Enter") { e.preventDefault(); 찾기(); }
}));
</script>
